name = "planifica-maestro"
main = "worker/index.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ACCESO_ABIERTO = "true"
HERRAMIENTAS_V2 = "true"
PROMPT_SISTEMA_V2 = "true"
STREAMING_PROGRESIVO = "true"
RATE_LIMIT_DISPOSITIVO_DIARIO = "25"
RATE_LIMIT_IP_DIARIO = "75"
RATE_LIMIT_GLOBAL_DIARIO = "500"
GEMINI_MODEL = "gemini-3.1-flash-lite"
GEMINI_VISION_MODELS = "gemini-3.1-flash-lite,gemini-3-flash-preview,gemini-3.5-flash-lite,gemini-flash-latest"
AI_PROVIDER = "gemini"
IA_APAGADA = "false"
RATE_LIMIT_ANONIMO_DIARIO = "25"

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "761bb5993306419ab6eebca4c526282d"

[assets]
directory = "./client/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

# -----------------------------------------------------------------------------
# ENTORNO STAGING (Aislado de producción para pruebas previas de despliegue)
# -----------------------------------------------------------------------------
[env.staging]
name = "planifica-maestro-staging"
main = "worker/index.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[env.staging.vars]
ENTORNO = "staging"
ACCESO_ABIERTO = "true" # "true" = beta abierta (omite x-app-key); "false" = exige APP_ACCESS_KEY institucional
PROMPT_SISTEMA_V2 = "true"
HERRAMIENTAS_V2 = "true"
STREAMING_PROGRESIVO = "true"
SUPABASE_URL = "https://tu-proyecto-staging.supabase.co"
SUPABASE_ANON_KEY = "tu-anon-key-staging"
# Secretos requeridos en staging (configurar con npx wrangler secret put <NAME> --env staging):
# 1. GEMINI_API_KEY (API key de Google Gemini)
# 2. SUPABASE_SERVICE_ROLE_KEY (Opcional en staging si solo se usa RPC anon; requerida para tareas admin)
# 3. APP_ACCESS_KEY (Requerida si ACCESO_ABIERTO = "false")
# 4. OWNER_MASTER_KEY (Requerida para endpoints /api/owner/*)
# 5. TAVILY_API_KEY (Opcional, para búsqueda web externa)
# Nota KV: Wrangler no hereda bindings de KV al entorno staging. Sin binding explícito, el worker usa Map() en memoria.
RATE_LIMIT_DISPOSITIVO_DIARIO = "50"
RATE_LIMIT_IP_DIARIO = "150"
RATE_LIMIT_GLOBAL_DIARIO = "1000"
GEMINI_MODEL = "gemini-3.1-flash-lite"
GEMINI_VISION_MODELS = "gemini-3.1-flash-lite,gemini-3.5-flash-lite,gemini-flash-latest"
AI_PROVIDER = "gemini"
IA_APAGADA = "false"
RATE_LIMIT_ANONIMO_DIARIO = "50"

[env.staging.assets]
directory = "./client/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

